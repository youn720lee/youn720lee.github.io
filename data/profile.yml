bio:
  - >-
    I am a Staff Engineer in the AI Inspection Technology Group at Samsung Electronics
    (Global Technology Research), where my work centers on <strong>Vision Foundation Models (VFM)</strong>
    and <strong>Embodied Recognition Models (ER)</strong> for manufacturing visual inspection. This spans
    foundation-model-based inspection platforms, visual grounding and anomaly detection under limited data,
    and the data and model infrastructure that brings these models to production lines.
  - >-
    I received my Ph.D. in Electrical Engineering and Computer Science from the Gwangju Institute of
    Science and Technology (GIST) in 2022, advised by Prof. Moongu Jeon. My doctoral research focused on
    robust visual perception in unconstrained environments, where recognition is threatened by bad weather,
    noise, occlusion, and dataset bias.

interests:
  - Vision Foundation Models for Industrial AI
  - Embodied Recognition for Inspection Robots
  - Visual Grounding & Open-vocabulary Detection
  - Anomaly Detection & Defect Recognition
  - Robust Perception & Efficient Vision Models

