<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-label="arXiv 2025">
  <defs>
    <linearGradient id="g-arxiv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <pattern id="p-arxiv" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="18" height="18" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#ffffff" stroke-opacity="0.10" stroke-width="6"/>
    </pattern>
  </defs>
  <rect width="240" height="180" rx="14" fill="url(#g-arxiv)"/>
  <rect width="240" height="180" rx="14" fill="url(#p-arxiv)"/>
  <circle cx="206" cy="-10" r="70" fill="#ffffff" fill-opacity="0.10"/>
  <text x="22" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-0.5">arXiv</text>
  <text x="22" y="138" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="18" fill="#ffffff" fill-opacity="0.85">2025</text>
